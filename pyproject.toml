[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"



[tool.setuptools]
py-modules = ["cli", "checks", "config", "git_snapshot", "sacroml_runner"]

[project]
name = "melody-wrapper"
version = "0.1.0"
description = "A CLI wrapper for the Flower (flwr) framework"
requires-python = ">=3.8"
dependencies = [
    "flwr",
    "sacroml",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.scripts]
melody = "cli:main"
